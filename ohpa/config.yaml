name: Open HeatPump Analytics
version: "0.4.7"
slug: ohpa
description: Local heat pump, building and room analytics (experimental)
url: https://github.com/sin7ek/OHPA
arch:
  - amd64
  - aarch64
image: ghcr.io/sin7ek/open-heatpump-analytics-ha
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8095

name: Test and publish Data Exporter
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_exporter_app.py
      - name: Verify exporter version
        run: |
          version=$(sed -n 's/^version: "\([^"]*\)"/\1/p' ohpa-exporter/config.yaml)
          grep -Fx "## $version" ohpa-exporter/CHANGELOG.md
          echo "EXPORTER_VERSION=$version" >> "$GITHUB_ENV"
      - run: docker build --target exporter -t ohpa-exporter:test .
      - name: Ingress denial smoke test
        run: |
          docker run -d --name exporter -p 127.0.0.1:8096:8096 ohpa-exporter:test
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8096/)" = 403 ]; then exit 0; fi
            sleep 2
          done
          docker logs exporter
          exit 1
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: exporter
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/sin7ek/ohpa-exporter:${{ env.EXPORTER_VERSION }}
